<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Dashboard</title>
    <!-- <link rel="stylesheet" href="/flask-exercise/static/inner-home.css"> -->
     <link rel="stylesheet" href="{{ url_for('static', filename = 'inner-home.css') }}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="logo">
            <h2>MyApp</h2>
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Analytics</a>
            <a href="#">Settings</a>
            <a href="#" class="logout-btn">Log Out</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- Top Header Bar -->
        <header class="top-header">
            <div class="welcome-text">
                <h1>Welcome Back, <span class="username">Alex!</span></h1>
                <p>Here is what's happening with your account today.</p>
            </div>
            <div class="user-profile">
                <div class="avatar">A</div>
            </div>
        </header>

        <!-- Main Dashboard Grid -->
        <main class="dashboard-grid">
            <!-- Card 1 -->
            <div class="card">
                <h3>Recent Activity</h3>
                <p class="card-value">Last login: Today, 3:40 PM</p>
                <span class="card-status status-good">Secure Connection</span>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <h3>Notifications</h3>
                <p class="card-value">3 New Updates</p>
                <span class="card-status status-alert">Action required</span>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <h3>Storage Used</h3>
                <p class="card-value">45.2 GB / 100 GB</p>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 45%;"></div>
                </div>
            </div>
        </main>

    </div>

</body>
</html>
