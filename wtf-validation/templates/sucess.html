
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .success-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #00000015;
        }

        .icon {
            font-size: 50px;
            color: green;
        }

        h1 {
            color: #15803d;
        }

        p {
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

    <div class="success-box">
        <div class="icon">✔</div>

        <h1>Success!</h1>

        <p>{{ message }}</p>

        <a href="/">Go Home</a>
    </div>

</body>
</html>
