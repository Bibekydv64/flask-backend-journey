<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin-login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='footer.css') }}">
</head>
<body id="top">
    {% include "navbar.html" %}

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-heading">
                <p class="eyebrow">ADMINISTRATION</p>
                <h2 id="login-title">Admin Login</h2>
                <p>Sign in to access the administration area.</p>
            </div>

            {% if error %}
                <p class="login-error" role="alert">{{ error }}</p>
            {% else %}
                <p class="login-notice" role="status">
                    Enter your administrator username and password.
                </p>
            {% endif %}

            <form class="login-form" method="post" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        maxlength="100"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button class="login-button" type="submit">Sign in</button>
            </form>
        </section>
    </main>

    {% include "footer.html" %}
</body>
</html>
